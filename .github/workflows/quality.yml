name: Qualité — contrats de contenu & build

# ============================================================================
# LA COUCHE GRATUITE. Tout ce qui est vérifiable SANS jugement tourne ici, à
# chaque push : les contrats de contenu, les types, le build. Aucun agent n'est
# payé pour faire ce qu'un script fait mieux et pour rien.
#
# Leçon des lots 5 à 12 : les agents de vérification échouaient une fois sur
# deux (limites de session, veille machine) et cela n'a JAMAIS bloqué un lot —
# le gate déterministe attrapait tout ce qui comptait, y compris deux erreurs
# médicales bloquantes. Les agents de jugement (.claude/agents/) n'interviennent
# qu'APRÈS ce gate, et seulement sur ce qu'un script ne peut pas trancher.
# ============================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contrats:
    name: Contrats de contenu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      # Chaque validateur sort en code ≠ 0 s'il trouve un manquement : le job
      # échoue de lui-même, pas besoin de parser la sortie.
      - name: Couverture des sondes d'anamnèse
        run: node scripts/checkProbeCoverage.mjs
      - name: Couverture des chapitres Muster
        run: node scripts/checkMusterCoverage.mjs
      - name: Cohérence chiffrée des cas
        run: node scripts/checkCaseCoherence.mjs
      - name: Contrat guide ↔ fiche patient
        run: node scripts/checkGuideCoverage.mjs
      - name: Doublons du guide d'anamnèse (thème, question, toggle synonyme)
        run: node scripts/checkGuideDuplicates.mjs
      - name: Tells d'interface (capitales, mono en libellé, classes cassées, ambre sur contrôles)
        run: node scripts/checkUiTells.mjs
      - name: Questions propres au cas — un chapitre, une information, dite au patient, sans doublon
        run: node scripts/checkCaseQuestionChapters.mjs
      - name: patientWorte — la clôture en langage patient (130 cas)
        run: node scripts/checkPatientWorte.mjs
      - name: "Trame jouée sans doublon (montage réel : variante, Fach adaptée, questions du cas)"
        run: node scripts/checkPlayedTrame.mjs
      - name: "Un symptôme, une question — trame jouée modulée, questions du cas relues"
        run: node scripts/checkTrameSymptoms.mjs
      - name: "Doctopus — jeu de référence et grille (sans réseau)"
        run: node scripts/evalDoctopus.mjs --dry
      - name: Sections thérapeutiques identiques fiche ↔ cas
        run: node scripts/checkTherapieLabels.mjs
      - name: Fachwissen visuals — schéma, refs, ergänzt
        run: node scripts/checkFachwissenVisuals.mjs
      - name: Conflits allergie ↔ thérapie
        run: node scripts/checkAllergyConflicts.mjs
      - name: Liaison cas ↔ Fachbegriffe — ≥ 8 termes par cas, ≤ 10 termes > 20 %, diagnostic lié, aucun mot d'examen, JSON à jour
        run: node scripts/checkCaseTermLinks.mjs
      - name: Tests du script de liaison (node:test)
        run: node --test scripts/linkCaseTerms.test.mjs
      - name: Tests du validateur de liaison (node:test)
        run: node --test scripts/checkCaseTermLinks.test.mjs
      - name: Registre des Fachbegriffe (F3)
        run: node scripts/checkTermRegister.mjs --require-all
      - name: Tests du validateur de registre
        run: node --test scripts/checkTermRegister.test.mjs

      # Informatifs : ils signalent des faiblesses de contenu (DD non
      # neutralisées, recouvrements de sondes) sans bloquer la livraison.
      - name: Cohésion clinique (informatif)
        run: node scripts/checkCaseCohesion.mjs || true
      - name: Recouvrement des sondes (informatif)
        run: node scripts/checkProbeOverlap.mjs || true

  build:
    name: Types & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Tests unitaires (Vitest, jsdom + fake-indexeddb) : sans cette ligne, aucun
      # critère d'acceptation client n'était gaté mécaniquement (constat pre-mortem V1).
      - run: npx vitest run --dir src
      - run: npm run build

  site:
    name: Site — contrats de contenu, voix, contraste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      # Invariants des jetons (teinte unique, filets de lumière, contraste) : le build du site
      # les consomme, ils passent donc avant lui.
      - name: Invariants des jetons de design
        working-directory: packages/tokens
        run: node --test test/tokens.test.mjs
      # Tous les validateurs du site lisent le HTML CONSTRUIT (foyer scripts/lib/dist.mjs) :
      # le build vient donc en premier, dans le même ordre que `npm run verify`.
      - run: npm run build
      - name: Tests du site (dont le contraste AA de la pile de profondeur)
        run: npm test
      - name: Fréquences par centre (données dérivées à jour)
        run: npm run check:frequencies
      - name: Parité des prix site ↔ app
        run: npm run check:pricing
      - name: Lexique — aucune promesse de résultat
        run: npm run check:lexicon
      - name: Voix de marque
        run: npm run check:voice
      - name: Mentions légales obligatoires
        run: npm run check:legal
      - name: Gabarits non substitués (bloquant si SITE_PUBLIC=true)
        run: npm run check:placeholders
      # `check:cta` lance Chromium via Playwright, et `npm ci` ne télécharge aucun navigateur :
      # sans cette étape, le job ne passe qu'en local, grâce au cache ~/Library/Caches/ms-playwright.
      # `--with-deps` installe aussi les bibliothèques système du runner Ubuntu.
      - name: Chromium pour Playwright (check:cta)
        run: npx playwright install --with-deps chromium
      - name: Appels à l'action
        run: npm run check:cta
      # `check:lighthouse` demande un serveur et un Chrome : il reste dans `npm run verify`
      # en local, et rejoindra ce job avec les budgets de performance du Plan B.

  rls:
    name: RLS & intégration Supabase
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: supabase start
      # Les tests d'intégration appellent les Edge Functions : on les sert en arrière-plan.
      - run: supabase functions serve --env-file supabase/.env.ci > /tmp/fn.log 2>&1 &
      - run: sleep 5
      - run: node scripts/testRls.mjs
      - if: always()
        run: supabase stop

  publish:
    name: Publier le contenu
    needs: [contrats, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: node scripts/publishContent.mjs
