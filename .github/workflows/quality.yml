name: Qualité — contrats de contenu & build

# ============================================================================
# LA COUCHE GRATUITE. Tout ce qui est vérifiable SANS jugement tourne ici, à
# chaque push : les contrats de contenu, les types, le build. Aucun agent n'est
# payé pour faire ce qu'un script fait mieux et pour rien.
#
# Leçon des lots 5 à 12 : les agents de vérification échouaient une fois sur
# deux (limites de session, veille machine) et cela n'a JAMAIS bloqué un lot —
# le gate déterministe attrapait tout ce qui comptait, y compris deux erreurs
# médicales bloquantes. Les agents de jugement (.claude/agents/) n'interviennent
# qu'APRÈS ce gate, et seulement sur ce qu'un script ne peut pas trancher.
# ============================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contrats:
    name: Contrats de contenu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # checkBudgetFloor lit la base par `git show`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      # Chaque validateur sort en code ≠ 0 s'il trouve un manquement : le job
      # échoue de lui-même, pas besoin de parser la sortie.
      - name: Couverture des sondes d'anamnèse
        run: node scripts/checkProbeCoverage.mjs
      - name: Couverture des chapitres Muster
        run: node scripts/checkMusterCoverage.mjs
      - name: Cohérence chiffrée des cas
        run: node scripts/checkCaseCoherence.mjs
      - name: Contrat guide ↔ fiche patient
        run: node scripts/checkGuideCoverage.mjs
      - name: Doublons du guide d'anamnèse (thème, question, toggle synonyme)
        run: node scripts/checkGuideDuplicates.mjs
      - name: Tells d'interface (capitales, mono en libellé, classes cassées, ambre sur contrôles)
        run: node scripts/checkUiTells.mjs
      - name: Questions propres au cas — un chapitre, une information, dite au patient, sans doublon
        run: node scripts/checkCaseQuestionChapters.mjs
      - name: patientWorte — la clôture en langage patient (130 cas)
        run: node scripts/checkPatientWorte.mjs
      - name: "Trame jouée sans doublon (montage réel : variante, Fach adaptée, questions du cas)"
        run: node scripts/checkPlayedTrame.mjs
      - name: "Un symptôme, une question — trame jouée modulée, questions du cas relues"
        run: node scripts/checkTrameSymptoms.mjs
      # Série 3 — une question à la fois. Le budget ne peut que baisser.
      - name: Atomicité des questions — budget dégressif (A B C D D2 D3 E)
        run: node scripts/checkQuestionAtomicity.mjs          # jamais --rule / --corpus (loupes, exit 0)
      - name: Aucun compteur dégressif ne remonte face à la base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="origin/$BASE_REF" ;;
            push)         BASE="$BEFORE" ;;
            *)            BASE="origin/main" ;;   # workflow_dispatch
          esac
          node scripts/checkBudgetFloor.mjs "$BASE"           # ref introuvable = exit 2 (push forcé : échec fermé)
      - name: Mutations — atomicité, trame, plancher (copie de travail)
        run: |
          node --test scripts/checkQuestionAtomicity.test.mjs
          node --test scripts/checkTrameSymptoms.test.mjs
          node --test scripts/checkBudgetFloor.test.mjs
          node --test scripts/checkProbeCoverage.test.mjs
          node --test scripts/checkQuestionOrder.test.mjs
          node --test scripts/checkCaseQuestionAnswers.test.mjs
          node --test scripts/checkCoherence.test.mjs
          node --test scripts/checkGuideDuplicates.test.mjs   # K4 (G.1) : une part répétée qui change de signe rougit
          node --test scripts/lotAssembler.test.mjs   # K5 (revue I1) : le profil survit à l'assemblage
          node --test scripts/checkExamen.test.mjs   # S4-7 : le verrouillage de l'Examen rougit sur ses trois règles
          node --test scripts/checkFachwissenFloor.test.mjs   # Lc4 (I6) : le plancher Fachwissen rougit sur ses trois règles
      - name: "Doctopus — jeu de référence et grille (sans réseau)"
        run: node scripts/evalDoctopus.mjs --dry
      - name: Verrouillage de l'Examen — aucune aide, aucune durée hors du plan, aucune relance (S4-7)
        run: node scripts/checkExamen.mjs
      - name: Sections thérapeutiques identiques fiche ↔ cas
        run: node scripts/checkTherapieLabels.mjs
      - name: Fachwissen visuals — schéma, refs, ergänzt
        run: node scripts/checkFachwissenVisuals.mjs
      - name: Conflits allergie ↔ thérapie
        run: node scripts/checkAllergyConflicts.mjs
      - name: Plancher Fachwissen — ≥ 5 questions d'examen, explication au patient et examinerQuestions en budget (Lc4)
        run: node scripts/checkFachwissenFloor.mjs
      - name: Liaison cas ↔ Fachbegriffe — ≥ 8 termes par cas, ≤ 10 termes > 20 %, diagnostic lié, aucun mot d'examen, JSON à jour
        run: node scripts/checkCaseTermLinks.mjs
      - name: Tests du script de liaison (node:test)
        run: node --test scripts/linkCaseTerms.test.mjs
      - name: Tests du validateur de liaison (node:test)
        run: node --test scripts/checkCaseTermLinks.test.mjs
      - name: Registre des Fachbegriffe (F3)
        run: node scripts/checkTermRegister.mjs --require-all
      - name: Tests du validateur de registre
        run: node --test scripts/checkTermRegister.test.mjs
      - name: Bedeutung des termes liés — ≤ 6 mots, pas une définition (F4a)
        run: node scripts/checkBedeutung.mjs
      - name: Tests du validateur Bedeutung
        run: node --test scripts/checkBedeutung.test.mjs

      # Informatifs : ils signalent des faiblesses de contenu (DD non
      # neutralisées, recouvrements de sondes) sans bloquer la livraison.
      - name: Cohésion clinique (informatif)
        run: node scripts/checkCaseCohesion.mjs || true
      - name: Recouvrement des sondes (informatif)
        run: node scripts/checkProbeOverlap.mjs || true
      - name: Ordre des questions — présupposition non satisfaite (informatif)
        run: node scripts/checkQuestionOrder.mjs || true
      - name: Réponse des questions du cas — la fiche répond-elle ? (informatif ; plancher dans checkBudgetFloor + test)
        run: node scripts/checkCaseQuestionAnswers.mjs || true
      # K3 (ADR-0023, contrat frage-atomique §10.6) : la porte du moteur de cohérence est BLOQUANTE, sans `|| true`.
      # K5 (INV-89) : le résidu est bloquant à 0 ; checkCoherence.test.mjs rougit si cette étape reçoit `|| true`.
      # Après montage (cohere) : doublons, horsProfil, exigeAbsent, relancesOrphelines, brauchtViole,
      # ajouteSansReponse = 0 et casRetiresParR1 = 0 ; structure (INV-77 à 80, 84) ; COHERENCE_ALLOWED valide ;
      # mesure ≤ plancher coherence-budget.json (qui ne remonte jamais : checkBudgetFloor).
      - name: Cohérence de l'anamnèse — porte après montage des 130 cas (bloquante)
        run: node scripts/checkCoherence.mjs

  build:
    name: Types & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Tests unitaires (Vitest, jsdom + fake-indexeddb) : sans cette ligne, aucun
      # critère d'acceptation client n'était gaté mécaniquement (constat pre-mortem V1).
      - run: npx vitest run --dir src
      - run: npm run build

  site:
    name: Site — contrats de contenu, voix, contraste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      # Invariants des jetons (teinte unique, filets de lumière, contraste) : le build du site
      # les consomme, ils passent donc avant lui.
      # Toute la suite (dont elevation.test : aucune ombre portée) puis la parité
      # tokens.json ↔ app (tailwind.config.js + index.css) : deux vraies portes.
      - name: Invariants des jetons de design
        working-directory: packages/tokens
        run: node --test test/*.test.mjs
      - name: Parité jetons ↔ app
        working-directory: packages/tokens
        run: node scripts/check-parity.mjs
      # Tous les validateurs du site lisent le HTML CONSTRUIT (foyer scripts/lib/dist.mjs) :
      # le build vient donc en premier, dans le même ordre que `npm run verify`.
      - run: npm run build
      - name: Tests du site (dont le contraste AA de la pile de profondeur)
        run: npm test
      - name: Fréquences par centre (données dérivées à jour)
        run: npm run check:frequencies
      - name: Parité des prix site ↔ app
        run: npm run check:pricing
      - name: Lexique — aucune promesse de résultat
        run: npm run check:lexicon
      - name: Voix de marque
        run: npm run check:voice
      - name: Mentions légales obligatoires
        run: npm run check:legal
      - name: Gabarits non substitués (bloquant si SITE_PUBLIC=true)
        run: npm run check:placeholders
      # `check:cta` lance Chromium via Playwright, et `npm ci` ne télécharge aucun navigateur :
      # sans cette étape, le job ne passe qu'en local, grâce au cache ~/Library/Caches/ms-playwright.
      # `--with-deps` installe aussi les bibliothèques système du runner Ubuntu.
      - name: Chromium pour Playwright (check:cta)
        run: npx playwright install --with-deps chromium
      - name: Appels à l'action
        run: npm run check:cta
      # `check:lighthouse` demande un serveur et un Chrome : il reste dans `npm run verify`
      # en local, et rejoindra ce job avec les budgets de performance du Plan B.

  rls:
    name: RLS & intégration Supabase
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }   # épinglé : « latest » interroge l'API GitHub et tombe en limite de débit
      - run: npm ci
      - run: supabase start
      # Les tests d'intégration appellent les Edge Functions : on les sert en arrière-plan.
      - run: supabase functions serve --env-file supabase/.env.ci > /tmp/fn.log 2>&1 &
      - run: sleep 5
      - run: node scripts/testRls.mjs
      - if: always()
        run: supabase stop

  # --------------------------------------------------------------------------
  # C6 — la couche « invariants » : propriétés sur le vrai corpus (130 cas), la
  # vraie base (fake-indexeddb) et l'horloge injectable, puis la PREUVE que
  # chacune rougit quand on réintroduit le défaut qu'elle garde (mutation sur
  # une copie de travail, jamais commitée). `npx vitest run --dir src` (job
  # « build ») ne descend pas dans app/tests : ce job est la seule porte.
  # --------------------------------------------------------------------------
  invariants-c6:
    name: Invariants C6 — propriétés et preuve par mutation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # Pas d'étape « vitest run --dir tests » à part : le socle de parcours-mutations la joue (copie
      # intacte) et sort en 1 si elle est rouge — la rejouer ici doublerait le temps pour rien.
      - name: Invariants en propriété (INV-1 à INV-28, FB3) puis preuve que chacun rougit sur sa mutation
        run: node scripts/parcours-mutations.mjs

  # --------------------------------------------------------------------------
  # C6 — la couche « candidat synthétique » : 14 jours ouvrés joués à travers
  # l'interface d'un build servi par `vite preview`, contre le Supabase LOCAL de
  # la CI, horloge pilotée par Playwright. Le contenu est publié dans ce
  # Supabase éphémère (publishContent.mjs) : le job ne dépend de rien d'externe.
  # NON BLOQUANT tant qu'il n'a pas tourné sur un runner (écrit hors CI, où il
  # a été mesuré) : `continue-on-error`, rapport en artefact. Retirer la ligne
  # une fois trois exécutions vertes de suite.
  # --------------------------------------------------------------------------
  candidat-c6:
    name: Candidat synthétique C6 (navigateur, Supabase local)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }   # épinglé : « latest » interroge l'API GitHub et tombe en limite de débit
      - run: npm ci
      # Playwright n'est pas une dépendance du dépôt : installé pour ce job seulement.
      - run: npm i --no-save playwright-core@1.63.0 && npx playwright-core install --with-deps chromium
      - run: supabase start
      - run: supabase functions serve --env-file supabase/.env.ci > /tmp/fn.log 2>&1 &
      - name: Env du Supabase local (clés masquées) et publication du contenu
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"; echo "::add-mask::$SERVICE_ROLE_KEY"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > /tmp/c6.env
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/publishContent.mjs
      - name: Le candidat joue 14 jours
        run: node scripts/parcours-candidat.mjs --env-file /tmp/c6.env --out ../c6-parcours-ci.md --shots /tmp/c6-captures
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/app/node_modules/playwright-core
      # Sondes 390 px (sans Supabase : `vite` sur une URL factice) — elles tournent même si le parcours a échoué.
      - name: Historique à 390, 375 et 1280 px (S4-6)
        if: ${{ !cancelled() }}
        run: node scripts/e2e/historique390.mjs
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/app/node_modules/playwright-core
      - name: Carte de couverture à 390 px (S4-5)
        if: ${{ !cancelled() }}
        run: node scripts/e2e/carteCouverture390.mjs
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/app/node_modules/playwright-core
      - name: Examen à 390 et 1280 px — examen complet accéléré, rechargement, onglet en arrière-plan, abandon, deux onglets (S4-7)
        if: ${{ !cancelled() }}
        run: node scripts/e2e/examen390.mjs
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/app/node_modules/playwright-core
      - name: Pages de cas à 390 px — aucun défilement horizontal, termes tronqués dans leur ligne (130 cas)
        if: ${{ !cancelled() }}
        run: node scripts/e2e/casDetail390.mjs
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/app/node_modules/playwright-core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6-parcours
          path: |
            c6-parcours-ci.md
            /tmp/c6-captures
      - if: always()
        run: supabase stop

  publish:
    name: Publier le contenu
    needs: [contrats, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: node scripts/publishContent.mjs
