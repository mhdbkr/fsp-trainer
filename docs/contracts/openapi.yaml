openapi: 3.1.0
info:
  title: Doctopus Edge Functions
  version: 1.0.0
  description: Contrat des fonctions serveur. Le client (app/) et les tests d'intégration (app/supabase/tests) s'y conforment.
servers:
  - url: "{supabase_url}/functions/v1"
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: JWT Supabase de l'utilisateur }
  schemas:
    ContentItem:
      type: object
      required: [id, kind, tier, version, payload, deleted]
      properties:
        id: { type: string }
        kind: { type: string, enum: [case, fachwissen, fachbegriff, aufklaerung, guide, muster] }
        tier: { type: integer, minimum: 1, maximum: 3 }
        version: { type: integer }
        payload: { type: object, description: "L'objet TS du type correspondant, tel quel (D8)" }
        deleted: { type: boolean }
    ProgressEvent:
      type: object
      required: [id, type, subject_id, payload, occurred_at]
      properties:
        id: { type: string, format: uuid, description: "Généré CLIENT — idempotence" }
        type: { type: string, enum: [simulation.completed, srs.reviewed, plan.done, case.layer_reached, program.configured] }
        subject_id: { type: [string, "null"], maxLength: 200 }
        payload: { type: object }
        occurred_at: { type: string, format: date-time, description: "Horloge CLIENT — ordre d'affichage seulement" }
        received_at: { type: string, format: date-time, description: "Horloge SERVEUR — curseur de pull, quotas" }
paths:
  /content:
    get:
      summary: Delta de contenu depuis une version, filtré par le tier de l'appelant (anonyme = 1). Pagine en interne — renvoie TOUT.
      parameters: [{ name: since, in: query, schema: { type: integer, minimum: 0, default: 0 } }]
      responses:
        "200":
          content: { application/json: { schema: { type: object, required: [version, items], properties: { version: { type: integer, description: "0 si aucune version publiée" }, items: { type: array, items: { $ref: "#/components/schemas/ContentItem" } } } } } }
        "400": { description: since invalide }
  /events:
    post:
      security: [{ bearer: [] }]
      summary: Ingestion d'un lot d'événements (≤ 100). Insert-only, idempotent par id. Un item invalide → 400 sur tout le lot ; une erreur d'insertion → rejected pour cet item seul.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/ProgressEvent" } } } } } } }
      responses:
        "200":
          content: { application/json: { schema: { type: object, required: [acked, received, rejected], properties: { acked: { type: array, items: { type: string } }, received: { type: object, additionalProperties: { type: string, format: date-time }, description: "received_at par id acquitté, rejeu inclus — le client le rétro-remplit pour avancer son curseur" }, rejected: { type: array, items: { type: object, properties: { id: { type: string }, reason: { type: string } } } } } } } }
        "400": { description: lot invalide }
        "401": { description: non authentifié }
        "429": { description: "rate limit : 600 requêtes / minute / utilisateur" }
    get:
      security: [{ bearer: [] }]
      summary: Événements de l'appelant dont received_at > since, ordonnés par received_at, limite 1000.
      parameters: [{ name: since, in: query, schema: { type: string, format: date-time, default: "1970-01-01T00:00:00Z" } }]
      responses:
        "200": { content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/ProgressEvent" } } } } } } }
        "401": { description: non authentifié }
  /checkout:
    post:
      security: [{ bearer: [] }]
      summary: Crée une session Stripe Checkout (abonnement). Un customer par utilisateur (metadata.user_id). Stripe Tax si STRIPE_AUTOMATIC_TAX=1.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [plan, returnUrl], properties: { plan: { type: string, enum: [pro, premium] }, returnUrl: { type: string, format: uri } } } } } }
      responses:
        "200": { content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } } } } } }
        "400": { description: plan non achetable }
        "401": { description: non authentifié }
  /portal:
    post:
      security: [{ bearer: [] }]
      summary: Lien vers le Customer Portal Stripe (résiliation, carte, factures).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [returnUrl], properties: { returnUrl: { type: string, format: uri } } } } } }
      responses:
        "200": { content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } } } } } }
        "404": { description: pas d'abonnement }
  /credits-consume:
    post:
      security: [{ bearer: [] }]
      summary: Débit atomique (verrou par utilisateur), idempotent par (reason, ref). À appeler AVANT l'appel IA ; 409 si insuffisant.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount, reason, ref], properties: { amount: { type: integer, minimum: 1, maximum: 1000 }, reason: { type: string, enum: [ai.arztbrief, ai.voice] }, ref: { type: string, maxLength: 200 } } } } } }
      responses:
        "200": { content: { application/json: { schema: { type: object, properties: { balance: { type: integer } } } } } }
        "409": { description: "crédits insuffisants — body { error: insufficient_credits, balance }" }
  /delete-account:
    post:
      security: [{ bearer: [] }]
      summary: Résilie chez Stripe (best effort) puis supprime auth.users ; cascade profils, abonnement, ledger, événements.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: boolean, const: true } } } } } }
      responses:
        "200": { content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
  /stripe-webhook:
    post:
      summary: Webhook Stripe. Signature vérifiée (stripe-signature) ; idempotent par event.id (table stripe_events). Événements traités — checkout.session.completed, customer.subscription.{created,updated,deleted}, invoice.paid (grant mensuel, ref = invoice.id), charge.refunded.
      responses:
        "200": { description: "reçu ({ received: true, duplicate?: true })" }
        "400": { description: signature invalide }
